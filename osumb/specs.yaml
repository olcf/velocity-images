versions:
- spec:
  - 7.5.2
dependencies:
- spec: opensuse
  when: distro=opensuse
- spec: rockylinux
  when: distro=rockylinux
- spec: ubuntu
  when: distro=ubuntu
- spec: mpich
- spec: rocm
  when: rocm
  scope: build
variables:
- name: prefix
  value: "/opt"
- name: rocm_flags
  value: --enable-rocm --with-rocm=/opt/rocm-{{ __rocm__version__ }}
  when: ^rocm
