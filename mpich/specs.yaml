versions:
- spec:
  - 3.4.3
  - 4.3.2
  - 5.0.0
dependencies:
- spec: ubuntu
  when: distro=ubuntu
- spec: opensuse
  when: distro=opensuse
- spec: rockylinux
  when: distro=rockylinux
- spec: gcc
- spec: xpmem
- spec: rocm
  when: rocm
  scope: build
- spec: ucx
  when: ucx
  scope: build
- spec: libfabric
  when: libfabric
  scope: build
variables:
- name: prefix
  value: "/opt"
- name: configure_flags
  value: >-
    --disable-cxx
    --enable-threads=runtime
    --with-ch4-shmmods=xpmem
    --with-xpmem={{ prefix }}/xpmem/{{ __xpmem__version__ }}
    --with-pm=none
    --with-pmi2-include=/usr/include/slurm
    --with-pmi2-lib=/usr
    --enable-yield=sched_yield
    --with-namepublisher=file
    --enable-fortran
    --disable-allowport
    --with-hwloc
    --enable-mpi-abi
- name: ucx_flags
  value: "--with-ucx={{ prefix }}/ucx/{{ __ucx__version__ }}"
  when: ^ucx
- name: libfabric_flags
  value: "--with-libfabric={{ prefix }}/libfabric/{{ __libfabric__version__ }}"
  when: ^libfabric
- name: netmods # default build libfabric (may be internal build)
  value: ofi
- name: netmods
  value: ucx
  when: ^ucx
- name: netmods
  value: ofi,ucx
  when: ^libfabric ^ucx
- name: rocm_flags
  value: "--with-hip=/opt/rocm-{{ __rocm__version__ }}"
  when: ^rocm
files:
- name: netmod.sh
  when: ^libfabric ^ucx
- name: entrypoint.sh
  when: ^libfabric ^ucx backend=podman
